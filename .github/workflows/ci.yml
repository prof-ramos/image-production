name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Python ${{ matrix.python }} tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Build local plugin
        run: python scripts/build_plugin.py

      - name: Validate release package from this exact commit
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python scripts/release_plugin.py prepare --sha "$SOURCE_SHA" --output "$RUNNER_TEMP/release-check"

  publish:
    name: Publish plugin and skill
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: image-production-publication
      cancel-in-progress: false
    steps:
      - name: Check out exact validated commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install release validation dependency
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Publish immutable payload and marketplace
        env:
          SOURCE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: credential.https://github.com.helper
          GIT_CONFIG_VALUE_1: '!gh auth git-credential'
        run: python scripts/release_plugin.py publish --sha "$SOURCE_SHA"
