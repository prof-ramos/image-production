name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Python ${{ matrix.python }} tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Build local plugin
        run: python scripts/build_plugin.py

      - name: Validate release package from this exact commit
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python scripts/release_plugin.py prepare --sha "$SOURCE_SHA" --output "$RUNNER_TEMP/release-check"
